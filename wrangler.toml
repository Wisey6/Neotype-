# Neotype Studio — Cloudflare Pages configuration
#
# Static site (no build step) + Pages Functions serving /api/* from
# functions/api/[[route]].js
#
# Secrets are NOT set here. Add them in the Cloudflare dashboard under
# Workers & Pages → neotype → Settings → Variables and Secrets:
#   ADMIN_PASSWORD      (secret)  password for /admin
#   STRIPE_SECRET_KEY   (secret)  sk_test_… then sk_live_…
#   RESEND_API_KEY      (secret)  optional, emails enquiries
#   ENQUIRY_TO          (plain)   where enquiries go
#   ENQUIRY_FROM        (plain)   verified sender address
#
# The KV namespace id below must be replaced with the real one after running:
#   npx wrangler kv namespace create NEOTYPE
# (see CLOUDFLARE.md for the full cutover runbook)

name = "neotype"
compatibility_date = "2026-08-01"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "NEOTYPE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
